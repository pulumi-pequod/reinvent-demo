<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>re:Invent Task Tracker</title>
    <style>
        :root {
            --violet-700: #5a30c5;   /* primary */
            --violet-600: #7952e5;
            --violet-500: #9077f3;   /* accent  */
            --violet-200: #dedbff;
            --violet-100: #ebebff;
            --violet-50:  #f5f5ff;   /* background */
            --ink:        #392960;   /* violet-900 */
            --teal:       #34cad7;   /* pulumipus */
            --line:       #e6e3f7;
            --muted:      #7b7596;
            --shadow:     0 1px 2px rgba(57,41,96,.06), 0 8px 24px rgba(57,41,96,.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background: radial-gradient(1200px 500px at 50% -200px, #ffffff, var(--violet-50));
            color: var(--ink);
            min-height: 100vh;
        }
        header {
            background: linear-gradient(120deg, var(--violet-700), var(--violet-500));
            color: #fff;
            padding: 22px 20px 26px;
            box-shadow: var(--shadow);
        }
        .header-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
        .logo { height: 26px; width: auto; flex: none; }
        .brand-divider { width: 1px; height: 28px; background: rgba(255,255,255,.35); }
        header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
        header p { margin: 3px 0 0; opacity: .85; font-size: 13px; }

        main { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }

        .panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        form { padding: 18px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        form .full { grid-column: span 2; }
        form label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
        form input {
            width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
            font-size: 14px; color: var(--ink); background: #fcfcff; transition: border-color .15s, box-shadow .15s;
        }
        form input::placeholder { color: #b4afc9; }
        form input:focus { outline: none; border-color: var(--violet-500); box-shadow: 0 0 0 3px rgba(144,119,243,.2); background: #fff; }
        form button {
            grid-column: span 2; padding: 12px; border: 0; border-radius: 10px;
            background: var(--violet-700); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
            transition: background .15s, transform .05s;
        }
        form button:hover { background: var(--violet-600); }
        form button:active { transform: translateY(1px); }

        .list-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 12px; }
        .list-head h2 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
        .progress { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
        .bar { width: 120px; height: 6px; border-radius: 999px; background: var(--violet-100); overflow: hidden; }
        .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--violet-500), var(--teal)); transition: width .3s ease; }

        ul { list-style: none; margin: 0; padding: 0; }
        li {
            background: #fff; border: 1px solid var(--line); border-radius: 14px;
            padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 1px 2px rgba(57,41,96,.04); transition: box-shadow .15s, transform .15s, opacity .15s;
        }
        li:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
        li.done { opacity: .62; }
        li.done .title { text-decoration: line-through; }

        .avatar {
            width: 38px; height: 38px; border-radius: 50%; flex: none;
            display: grid; place-items: center; font-weight: 700; font-size: 14px;
            background: var(--violet-100); color: var(--violet-700);
        }
        .task-body { flex: 1; min-width: 0; }
        .title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .assignee { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

        .actions { display: flex; gap: 8px; flex: none; }
        .actions button {
            border: 1px solid var(--line); background: #fff; border-radius: 9px;
            padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink);
            transition: background .15s, border-color .15s, color .15s;
        }
        .actions button.remind { border-color: var(--teal); color: #16808b; background: #effcfd; }
        .actions button.remind:hover { background: var(--teal); color: #fff; }
        .actions button.done:hover { background: var(--violet-50); border-color: var(--violet-500); color: var(--violet-700); }

        .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
        .empty .emoji { font-size: 30px; display: block; margin-bottom: 10px; }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px);
            background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px;
            font-size: 13px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

            <div class="brand-divider"></div>
            <div>
                <h1>re:Invent Task Tracker</h1>
                <p>Click "Remind" to nudge an assignee by email.</p>
            </div>
        </div>
    </header>
    <main>
        <form id="new-task" class="panel">
            <div class="full">
                <label for="title">Task</label>
                <input id="title" class="full" placeholder="What needs doing?" required />
            </div>
            <div>
                <label for="assigneeName">Assignee</label>
                <input id="assigneeName" placeholder="Name" />
            </div>
            <div>
                <label for="assigneeEmail">Email</label>
                <input id="assigneeEmail" type="email" placeholder="name@example.com" />
            </div>
            <button type="submit">Add task</button>
        </form>

        <div class="list-head">
            <h2>Tasks</h2>
            <div class="progress">
                <span id="count">0 of 0 done</span>
                <div class="bar"><span id="bar-fill"></span></div>
            </div>
        </div>
        <ul id="tasks"></ul>
        <div id="empty" class="empty panel">
            <span class="emoji">📋</span>
            No tasks yet — add your first one above.
        </div>
    </main>
    <div id="toast" class="toast"></div>

    <script>
        const API = "__API_ENDPOINT__";

        function toast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2600);
        }

        function initial(task) {
            const s = (task.assigneeName || task.title || "?").trim();
            return s ? s[0].toUpperCase() : "?";
        }

        function updateProgress(tasks) {
            const done = tasks.filter((t) => t.done).length;
            document.getElementById("count").textContent = `${done} of ${tasks.length} done`;
            const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            document.getElementById("bar-fill").style.width = pct + "%";
        }

        async function loadTasks() {
            const res = await fetch(`${API}/tasks`);
            const tasks = await res.json();
            const ul = document.getElementById("tasks");
            const empty = document.getElementById("empty");
            ul.innerHTML = "";
            empty.style.display = tasks.length ? "none" : "block";
            updateProgress(tasks);
            for (const t of tasks) {
                const li = document.createElement("li");
                if (t.done) li.className = "done";
                const who = t.assigneeName || t.assigneeEmail
                    ? `${t.assigneeName || "Unassigned"}${t.assigneeEmail ? " · " + t.assigneeEmail : ""}`
                    : "Unassigned";
                li.innerHTML = `
                    <div class="avatar"></div>
                    <div class="task-body">
                        <div class="title"></div>
                        <div class="assignee"></div>
                    </div>
                    <div class="actions">
                        <button class="remind">Remind</button>
                        <button class="done">Done</button>
                    </div>`;
                li.querySelector(".avatar").textContent = initial(t);
                li.querySelector(".title").textContent = t.title;
                li.querySelector(".assignee").textContent = who;
                li.querySelector(".remind").onclick = () => remind(t);
                li.querySelector(".done").onclick = () => markDone(t.id);
                ul.appendChild(li);
            }
        }

        async function addTask(e) {
            e.preventDefault();
            const title = document.getElementById("title").value.trim();
            const assigneeName = document.getElementById("assigneeName").value.trim();
            const assigneeEmail = document.getElementById("assigneeEmail").value.trim();
            if (!title) return;
            await fetch(`${API}/tasks`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, assigneeName, assigneeEmail }),
            });
            e.target.reset();
            loadTasks();
        }

        async function markDone(id) {
            await fetch(`${API}/tasks/${id}/done`, { method: "POST" });
            loadTasks();
        }

        async function remind(task) {
            const res = await fetch(`${API}/remind`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ taskId: task.id }),
            });
            const body = await res.json().catch(() => ({}));
            if (res.ok) {
                toast(`Reminder sent to ${task.assigneeEmail || "assignee"}`);
            } else {
                toast(body.message || "Could not send the reminder email.");
            }
        }

        document.getElementById("new-task").addEventListener("submit", addTask);
        loadTasks();
    </script>
