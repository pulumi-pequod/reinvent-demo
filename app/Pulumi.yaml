name: reinvent-tasks
description: >-
  Task-tracker demo app: API Gateway + Lambda + DynamoDB, with a static web UI served from S3. Each task has a "Remind" button; the /remind endpoint is a stub — email delivery is intentionally left unimplemented.
runtime:
  name: nodejs
  options:
    packagemanager: npm
packages:
  serverless-api: github.com/pulumi-pequod/reinvent-demo.git/components/serverless-api@0.6.0
  static-website: github.com/pulumi-pequod/reinvent-demo.git/components/static-website@0.6.0
config:
  pulumi:tags:
    value:
      pulumi:template: aws-typescript
